name: Set up native build dependencies
description: Install codec build dependencies or just the runtime libraries.
inputs:
  runtime-only:
    description: Skip compilers and Rust when running prebuilt tests.
    default: "false"
runs:
  using: composite
  steps:
    - name: Install native build tools
      shell: bash
      run: |
        sudo apt-get update
        if [[ "${{ inputs.runtime-only }}" != "true" ]]; then
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev
        fi
    - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
      id: native-env
      with:
        environment-file: environment/ci-native.yml
        environment-name: vclasp-native
        cache-environment: true
    - name: Select codec libraries
      shell: bash
      run: |
        native="${{ steps.native-env.outputs.environment-path }}"
        echo "PKG_CONFIG_PATH=$native/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "VCLASP_NATIVE_LIB=$native/lib" >> "$GITHUB_ENV"
        echo "$native/bin" >> "$GITHUB_PATH"
        test -f "$native/lib/pkgconfig/libavcodec.pc"
    - name: Select Rust toolchain
      if: inputs.runtime-only != 'true'
      shell: bash
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
        rustup default "$RUST_TOOLCHAIN"
