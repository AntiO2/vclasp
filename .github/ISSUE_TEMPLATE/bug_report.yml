name: Bug report
description: Report an incorrect result, crash, or API failure.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the private reporting link in SECURITY.md. Remove credentials and private data from all attachments."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the failure and how it affects your application.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command or code, input characteristics, and relevant logs. Use a small shareable fixture when possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Commit or release, OS, Rust/Python versions, FFmpeg version, build features, and local/S3/AIStore backend.
    validations:
      required: true
