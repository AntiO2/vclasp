name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RUST_TOOLCHAIN: "1.96.1"

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install formatters
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
          python -m pip install -r requirements-dev.txt
      - name: Check Rust formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path object-store-transport/Cargo.toml --all --check
      - name: Check Python formatting
        run: python -m ruff format --check tests examples

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-native
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: build
          workspaces: |
            . -> target
            object-store-transport -> target
      - name: Build default and codec APIs
        run: |
          cargo build --locked
          cargo build --locked --features ffmpeg --lib --examples
          cargo build --locked --manifest-path object-store-transport/Cargo.toml
      - name: Compile experiment controls
        run: cargo check --locked --features experiment-controls --all-targets

  rust-unit-tests:
    name: Rust unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-native
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rust-unit-tests
          workspaces: |
            . -> target
            object-store-transport -> target
      - name: Test core and public Rust API
        run: cargo test --locked --features ffmpeg --lib --test rust_session_api
      - name: Test transport validation and accounting
        run: cargo test --locked --manifest-path object-store-transport/Cargo.toml --lib

  python-unit-tests:
    name: Python unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: ./.github/actions/setup-native
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: python-unit-tests
      - name: Build and install this checkout
        run: |
          python -m pip install -r requirements-dev.txt
          maturin build --locked --features ffmpeg --profile dev --compatibility linux --interpreter python --out "$RUNNER_TEMP/wheels"
          python -m pip install --no-deps "$RUNNER_TEMP"/wheels/*.whl
      - name: Run Python unit tests with temporary local storage
        run: python -m pytest --basetemp "$RUNNER_TEMP/pytest"
