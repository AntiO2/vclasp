[package]
name = "vclasp-object-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Shared object-store Range GET transport for VClasp"
repository = "https://github.com/AntiO2/vclasp"
readme = "README.md"
publish = false

[lib]
name = "vclasp_object_store"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
futures-util = "0.3"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
